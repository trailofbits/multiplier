# Compiler argument patterns for mx-index to elide from compilation commands.
#
# When mx-index re-invokes the original compiler to discover system include
# paths and version information, arguments matching these patterns are stripped
# from the command line. This prevents the compiler invocation from failing due
# to unsupported or irrelevant flags.
#
# Format:
#
#   <match> <pattern> [<num_values>]
#
# match:
#   exact    - argument must equal <pattern> exactly
#   prefix   - argument must start with <pattern>
#   contains - argument must contain <pattern> as a substring
#
# num_values (how many subsequent arguments to also skip):
#   (omitted or 0) - only skip the matched argument itself
#   N              - also skip the next N arguments unconditionally
#  ~N              - also skip the next N arguments, but only if they don't
#                    start with '-'. This handles malformed compilation
#                    databases (e.g. the Linux kernel) where a "value" may
#                    actually be the next flag:
#                        -main-file-name -mrelocation-model ...
#
# Lines starting with '#' are comments. Empty lines are ignored.
# The first matching rule wins; subsequent rules are not checked.
#
# You can provide additional patterns via --extra_arg_patterns <file>.

# ---------------------------------------------------------------------------
# Warning and diagnostic flags
# ---------------------------------------------------------------------------

prefix  -W
prefix  -pedantic

# ---------------------------------------------------------------------------
# Sanitizer and coverage flags
# ---------------------------------------------------------------------------

prefix  -fsanitize=
prefix  -fcoverage-compilation-dir=
prefix  -fcrash-diagnostics-dir=

# ---------------------------------------------------------------------------
# Hardening / instrumentation flags
# ---------------------------------------------------------------------------

prefix  -ftrivial-auto-var-init=
prefix  -fpatchable-function-entry=
prefix  -fpatchable-function-entry-offset=
prefix  -fstrict-flex-arrays=
prefix  -mfunction-return=
exact   -fskip-odr-check-in-gmf
exact   -pic-is-pie
exact   -mindirect-branch-cs-prefix

# ---------------------------------------------------------------------------
# Internal compiler options (flag + one value)
# ---------------------------------------------------------------------------
# These always take exactly one following argument, even if that argument
# looks like a flag (e.g. -Xclang -emit-llvm).

exact   -Xclang  1
exact   -mllvm   1

# ---------------------------------------------------------------------------
# Internal compiler options (flag + one value, lenient)
# ---------------------------------------------------------------------------
# These expect one following argument, but in some compilation databases the
# "value" is actually the next flag. The ~1 modifier skips the following
# argument only when it does not start with '-'.

exact   -dependency-file      ~1
exact   -diagnostic-log-file  ~1
exact   -header-include-file  ~1
exact   -stack-usage-file     ~1
exact   -mrelocation-model    ~1
exact   -pic-level            ~1
exact   -main-file-name       ~1
exact   -MT                   ~1
exact   -MQ                   ~1

# ---------------------------------------------------------------------------
# File-path options (matched by substring)
# ---------------------------------------------------------------------------
# Catches a broad range of -f*-file=, -f*-seed-file=, etc.

contains  -file=

# ---------------------------------------------------------------------------
# Remaining options with embedded values (prefix=value form)
# ---------------------------------------------------------------------------

prefix  -dependent-lib=
prefix  -stats-file=
prefix  -fprofile-list=
prefix  -fxray-always-instrument=
prefix  -fxray-never-instrument=
prefix  -fxray-attr-list=
prefix  -tsan-compound-read-before-write=
prefix  -tsan-distinguish-volatile=
prefix  -treat
prefix  -split-threshold-for-reg-with-hint=
prefix  -instcombine-lower-dbg-declare=

# ===========================================================================
#
#  GCC-specific flags not recognized by Clang
#
#  These appear in compile_commands.json from GCC-built projects (e.g. the
#  Linux kernel) and cause "unknown argument" errors in Clang.
#
# ===========================================================================

# ---------------------------------------------------------------------------
# GCC --param tuning knobs (entire family is GCC-only)
# ---------------------------------------------------------------------------
# --param=name=value  or  --param name=value

prefix  --param=
exact   --param   1

# ---------------------------------------------------------------------------
# GCC spec files (entire family is GCC-only)
# ---------------------------------------------------------------------------

prefix  -specs=
exact   -specs   1
prefix  --specs=
exact   --specs  1

# ---------------------------------------------------------------------------
# GCC plugin system (incompatible with Clang's plugin system)
# ---------------------------------------------------------------------------

prefix  -fplugin=
prefix  -fplugin-arg-

# ---------------------------------------------------------------------------
# GCC interprocedural analysis passes (entire family is GCC-only)
# ---------------------------------------------------------------------------

prefix  -fipa-
prefix  -fno-ipa-

# ---------------------------------------------------------------------------
# GCC dump / optimization-info flags (entire family is GCC-only)
# ---------------------------------------------------------------------------

prefix  -fdump-rtl-
prefix  -fdump-tree-
prefix  -fdump-ipa-
prefix  -fopt-info

# ---------------------------------------------------------------------------
# GCC optimization flags with no Clang equivalent
# ---------------------------------------------------------------------------
# NOTE: -ftree-vectorize and -ftree-slp-vectorize ARE valid Clang aliases
# (for -fvectorize and -fslp-vectorize), so we cannot blanket-strip -ftree-*.

exact   -fno-var-tracking
exact   -fno-var-tracking-assignments
exact   -fconserve-stack
exact   -fno-allow-store-data-races
exact   -fallow-store-data-races
exact   -fno-code-hoisting
exact   -fno-tree-loop-im
exact   -fno-tree-loop-ivcanon
exact   -fno-tree-loop-distribute-patterns
exact   -fno-tree-loop-distribution
exact   -fno-tree-switch-conversion
exact   -fno-tree-tail-merge
exact   -fno-tree-pre
exact   -fno-tree-dse
exact   -fno-partial-inlining
exact   -fno-inline-functions-called-once
exact   -fno-hoist-adjacent-loads
exact   -fno-guess-branch-probability
exact   -fno-tracer
exact   -fno-caller-saves
exact   -fno-defer-pop
exact   -fno-function-cse
exact   -fno-peephole2
exact   -fno-gcse
exact   -fno-gcse-lm
exact   -fno-gcse-sm
exact   -fno-reorder-blocks
exact   -fno-reorder-blocks-and-partition
exact   -fno-reorder-functions
exact   -fno-toplevel-reorder
exact   -fno-unit-at-a-time
exact   -fno-live-range-shrinkage
exact   -fno-devirtualize-speculatively
exact   -fno-enforce-eh-specs
exact   -fweb
exact   -fno-web
exact   -frename-registers
exact   -fno-rename-registers
exact   -fno-strength-reduce

# GCC Graphite (polyhedral) loop optimization flags.
exact   -fgraphite
exact   -fgraphite-identity
exact   -floop-nest-optimize
exact   -floop-parallelize-all

# ---------------------------------------------------------------------------
# GCC scheduler flags (no Clang equivalent)
# ---------------------------------------------------------------------------

exact   -fno-schedule-insns
exact   -fno-schedule-insns2
exact   -fno-sched-pressure
exact   -fsched-pressure
exact   -fsched2-use-superblocks
exact   -fsched-stalled-insns
prefix  -fsched-stalled-insns=
exact   -fsched-stalled-insns-dep
prefix  -fsched-stalled-insns-dep=

# ---------------------------------------------------------------------------
# GCC alignment flags (extended syntax not supported by Clang)
# ---------------------------------------------------------------------------
# NOTE: -falign-functions[=N] and -falign-loops=N ARE functional in Clang,
# so we only strip the forms that Clang does not support.

prefix  -falign-jumps
prefix  -falign-labels

# ---------------------------------------------------------------------------
# GCC LTO flags with no Clang equivalent
# ---------------------------------------------------------------------------

prefix  -flto-partition=
exact   -fuse-linker-plugin
exact   -fno-use-linker-plugin

# ---------------------------------------------------------------------------
# GCC profile flags with no Clang equivalent
# ---------------------------------------------------------------------------

exact   -fprofile-correction
prefix  -fprofile-dir=

# ---------------------------------------------------------------------------
# GCC-specific machine flags (x86)
# ---------------------------------------------------------------------------
# These are common in Linux kernel compile_commands.json.

exact   -mrecord-mcount
exact   -mnop-mcount
exact   -mfentry
exact   -mno-fp-ret-in-387
exact   -mno-80387
exact   -maccumulate-outgoing-args
exact   -mskip-rax-setup
prefix  -mpreferred-stack-boundary=
exact   -mno-avx256-split-unaligned-load
exact   -mno-avx256-split-unaligned-store
exact   -mindirect-branch-register
prefix  -mindirect-branch=
prefix  -mharden-sls=

# ---------------------------------------------------------------------------
# GCC diagnostic generation flags
# ---------------------------------------------------------------------------

exact   -fdiagnostics-generate-patch
prefix  -ftrack-macro-expansion

# ===========================================================================
#
#  Removed or deprecated Clang flags
#
#  These were accepted by older Clang versions but cause errors in newer ones.
#
# ===========================================================================

# Removed in Clang 16 (old/new pass manager flags).
exact   -fexperimental-new-pass-manager
exact   -fno-experimental-new-pass-manager
exact   -flegacy-pass-manager
exact   -fno-legacy-pass-manager
exact   -analyzer-store                   ~1
exact   -analyzer-opt-analyze-nested-blocks

# Removed in Clang 17.
exact   -fmodules-ts
exact   -fcoroutines-ts

# Removed in Clang 18.
exact   -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang

# Removed in Clang 21.
exact   -frelaxed-template-template-args
exact   -fno-relaxed-template-template-args

# ===========================================================================
# Others
# ===========================================================================

exact   -ffixed-r8
exact   -ffixed-r9
exact   -mno-abicalls
